[project]
name = "clawguard"
version = "0.1.0"
description = "Security middleware for OpenClaw agents — defends against prompt injection across modalities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "cryptography>=42.0.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.26",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
ml = ["transformers>=5.5.4", "torch>=2.0.0"]
chain = ["web3>=7.0.0"]
aws = ["boto3>=1.34", "botocore>=1.34", "eth-account>=0.13.0", "coincurve>=19.0.0", "cryptography>=42.0.0"]
ocr = ["pytesseract>=0.3.10"]
audio = ["openai-whisper>=20250625"]
pdf-gen = ["reportlab>=4.0.0"]
demo = ["alpaca-py>=0.43.2"]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "bandit>=1.8.0",
    "mypy>=1.11.0",
    "pytest-asyncio>=0.24.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "boto3>=1.34",
    "botocore>=1.34",
    "eth-account>=0.13.0",
    "coincurve>=19.0.0",
    "cryptography>=42.0.0",
]
local = ["transformers>=5.5.4", "torch>=2.0.0", "web3>=7.0.0", "pytesseract>=0.3.10", "python-dotenv>=1.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Ship all the runtime Python packages in the repo. The root `api/` package is
# Vercel-only and intentionally excluded; `contracts/`, `dashboard/`, `demo/`,
# `docs/`, `infra/` are not Python.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "skill*",
    "clawguard*",
    "learning*",
    "network*",
    "zk*",
    "detector*",
    "extractor*",
    "blockchain*",
    "store*",
]
exclude = [
    "tests*",
    "dashboard*",
    "contracts*",
    "demo*",
    "docs*",
    "infra*",
    ".worktrees*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "skill/tests",
    "learning/tests",
    "network/tests",
    "blockchain/tests",
    "tests/contracts",
    "tests/corpus",
    "tests/integration",
    "tests/performance",
    "zk/tests",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".worktrees",
    "dashboard",
    "contracts",
    "public",
    ".venv",
    "**/__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # handled by formatter
    "B008",   # FastAPI uses function-call defaults (Depends/Query/File/Form)
    "SIM105", # `contextlib.suppress` is noisier than try/except pass here
    "RUF003", # Unicode in comments (en-dash) is intentional
    "RUF012", # dataclass field mutability — noisy on legacy dataclasses
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM", "F401"]
"**/tests_on_chain/**" = ["B", "SIM", "F401"]
"skill/migrations/versions/*.py" = ["E501"]
"detector/bench/**" = ["B905", "RUF046", "E402"]  # research scripts
"blockchain/defense_agent/**" = ["I001"]  # structlog import ordering handled elsewhere
"zk/prover_host.py" = ["E402"]

[tool.bandit]
exclude_dirs = [
    ".worktrees",
    "dashboard",
    "contracts",
    "public",
    ".venv",
    "tests",
    "skill/tests",
    "learning/tests",
    "network/tests",
    "blockchain/tests",
    "zk/tests",
]
skips = ["B101"]  # assert_used — legitimate in init paths / typed asserts

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
    "\\.worktrees",
    "contracts",
    "dashboard",
    "public",
    "\\.venv",
]
